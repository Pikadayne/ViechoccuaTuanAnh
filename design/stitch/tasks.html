<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stitch — Danh sách công việc | Tuan Anh's Task Manager</title>
</head>
<body>
  <div>
    <h1>Việc học của tôi</h1>
    <button>Đăng xuất</button>
    <main>
      <form>
        <label for="task-title">Tên công việc</label>
        <input id="task-title" type="text" placeholder="Ôn Next.js..." />
        <button type="submit">Thêm công việc</button>
      </form>
      <ul>
        <li data-testid="task-item">
          <input type="checkbox" id="task-1" />
          <label for="task-1">Đọc tài liệu Next.js</label>
          <button>Sửa</button>
          <button>Xóa</button>
        </li>
      </ul>
    </main>
  </div>
</body>
</html>
